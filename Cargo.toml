[package]
name = "mdbook-kanagawa-theme"
version = "1.2.3"
edition = "2024"
authors = ["T. Sawyer saylesss88@github.com"]
license = "Apache-2.0"
description = "Stunning Kanagawa‑inspired interactive mdBook landing page with flexible layouts, rich theming, and a built‑in content collections showcase."
repository = "https://github.com/saylesss88/mdbook-kanagawa-theme"
readme = "README.md"
keywords = ["mdbook", "theme", "blog", "content-collections", "preprocessor"]
categories = ["command-line-utilities"]
homepage = "https://github.com/saylesss88/mdbook-kanagawa-theme"
documentation = "https://docs.rs/mdbook-kanagawa-theme"
exclude = [".github/*", ".gitignore", "book/*"]

[lib]
name = "mdbook_kanagawa_theme"
path = "src/lib.rs"

[[bin]]
name = "mdbook-kanagawa-theme"
path = "src/bin/mdbook-kanagawa-theme.rs"

[dependencies]
mdbook-preprocessor = "0.5.1"
serde_json = "1.0"
serde = {version = "1.0", features = ["derive"]}
log = "0.4"
env_logger = "0.11.8"
semver = "1.0"
