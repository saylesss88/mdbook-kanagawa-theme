[package]
name = "mdbook-kanagawa-theme"
version = "1.3.0"
edition = "2024"
authors = ["T. Sawyer <saylesss88@github.com>"]
license = "Apache-2.0"
description = "Stunning Kanagawa‑inspired interactive mdBook landing page with flexible layouts, rich theming, and a built‑in content collections showcase."
repository = "https://github.com/saylesss88/mdbook-kanagawa-theme"
readme = "README.md"
keywords = ["mdbook", "theme", "blog", "content-collections", "preprocessor"]
categories = ["command-line-utilities"]
homepage = "https://github.com/saylesss88/mdbook-kanagawa-theme"
documentation = "https://docs.rs/mdbook-kanagawa-theme"
exclude = [".github/*", ".gitignore", "book/*"]

[features]
# Default: just the Kanagawa CSS theme injected into any standard mdBook.
# Enable `blog` to get the interactive landing page that reads from
# window.CONTENT_COLLECTIONS (requires mdbook-content-collections +
# mdbook-content-loader to be configured alongside this preprocessor).
default = []
blog = []

[[bin]]
name = "mdbook-kanagawa-theme"
path = "src/bin/mdbook-kanagawa-theme.rs"

[dependencies]
mdbook-preprocessor = "0.5.4"
serde_json = "1.0"
serde = {version = "1.0", default-features = false}
semver = {version = "1.0", default-features = false}

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}
rust_2018_idioms = {level = "warn", priority = -1}

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
