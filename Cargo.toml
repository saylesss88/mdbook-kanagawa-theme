[package]
name = "mdbook-kanagawa-theme"
version = "0.3.4"
edition = "2024"
description = "Stunning Kanagawa-inspired theme for mdBook with built-in content collection showcase"
license = "Apache-2.0"
keywords = ["mdbook", "theme", "kanagawa", "content-collections"]
categories = ["command-line-utilities"]

[lib]
name = "mdbook_kanagawa_theme"
path = "src/lib.rs"

[[bin]]
name = "mdbook-kanagawa-theme"
path = "src/bin/mdbook-kanagawa-theme.rs"

[dependencies]
mdbook-preprocessor = "0.5.1"
serde_json = "1.0"
serde = {version = "1.0", features = ["derive"]}
log = "0.4"
env_logger = "0.11.8"
semver = "1.0"
